<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Rendre l'eau buvable</title>
<desc id="d">Trois étapes : filtrer l'eau à travers du tissu, du sable et du charbon, la faire bouillir quelques minutes, puis la désinfecter et attendre 30 minutes avant de boire.</desc>
