<title id="t">Claques dans le dos et compressions</title>
<desc id="d">Vignette 1 : la personne penchée en avant reçoit jusqu'à 5 claques entre les omoplates ; vignette 2 : le sauveteur, derrière elle, tire son poing placé au creux de l'estomac vers lui et vers le haut, jusqu'à 5 fois.</desc>
