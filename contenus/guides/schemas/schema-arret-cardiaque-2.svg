<title id="t">Électrodes du défibrillateur</title>
<desc id="d">Une électrode se colle sous la clavicule droite de la victime, l'autre sur le côté gauche sous l'aisselle ; le défibrillateur se reconnaît à son cœur blanc et à son éclair sur fond vert.</desc>
