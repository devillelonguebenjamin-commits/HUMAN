<title id="t">Inondation : ni voiture ni sous-sol</title>
<desc id="d">Une voiture est emportée par le courant d'une eau peu profonde, et un escalier qui descend vers un sous-sol inondé est barré : ne prenez pas votre voiture et ne descendez pas au sous-sol.</desc>
