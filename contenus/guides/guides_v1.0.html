<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guides SIJAMAIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calme, clair, rassurant, institutionnel (mairies, régions)
   IDEA: une fiche réflexe plastifiée qu'on garde dans le sac, devenue application
   PICTURE: l'application elle-même, colonne mobile, gros bouton Urgence orange balise
   COLOUR and TYPE: vert forêt dominant, lichen clair, orange balise en accent; Space Grotesk + Inter
   LAYOUT: colonne de 520px centrée sur un fond vert plein; une vue à la fois, navigation par ancre */
:root{color-scheme:light dark;
--bg:light-dark(#1F3B2D,#0c1510);--app:light-dark(#F3F4EF,#121c16);--card:light-dark(#FFFFFF,#1a271f);
--ink:light-dark(#17241C,#E8ECE4);--mute:light-dark(#4A5A50,#A9B5AC);--line:light-dark(#DCDFD6,#2b3a31);
--green:light-dark(#1F3B2D,#9CC5AE);--green-soft:light-dark(#E3EBE4,#1f3327);
--orange:#E0662A;--orange-deep:light-dark(#A8431A,#E57A45);--orange-soft:light-dark(#FBE7DC,#3a2216);--on-orange:light-dark(#fff,#1a0d06)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--app);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 20px 60px rgba(0,0,0,.25)}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#F3F4EF;padding:12px 16px;display:flex;align-items:center;gap:12px}
:root[data-theme=dark] header{background:#17241C}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) header{background:#17241C}}
.brand{font:700 20px/1 'Space Grotesk',sans-serif;letter-spacing:-.01em}.brand b{color:var(--orange);font-weight:700}
.offline{margin-left:auto;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:99px;white-space:nowrap}
.back{appearance:none;border:0;background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.back:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main{padding:16px 16px 48px}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:32px;letter-spacing:-.02em}h2{font-size:20px}h3{font-size:17px}
.mute{color:var(--mute)}
.sos{display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;background:var(--orange-deep);color:var(--on-orange);border-radius:20px;padding:18px;margin:14px 0 18px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.sos svg{flex:none}.sos strong{display:block;font:700 22px/1.1 'Space Grotesk',sans-serif}.sos span{font-size:14px;opacity:.92}
.search{position:relative;margin-bottom:18px}.search input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px Inter,sans-serif;padding:0 14px 0 44px}
.search svg{position:absolute;left:14px;top:16px;color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:150px}
.cat .ic{width:48px;height:48px;border-radius:14px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.cat.urg .ic{background:var(--orange-soft);color:var(--orange-deep)}
.cat h2{font-size:18px}.cat p{margin:0;font-size:14px;color:var(--mute)}.cat small{margin-top:auto;font-size:13px;font-weight:600;color:var(--green)}
.cat.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}.cat.wide>div{display:flex;flex-direction:column;gap:2px}
.sect{margin:26px 0 10px;font-size:14px;font-weight:600;color:var(--mute)}
.glist{display:flex;flex-direction:column;gap:10px}
.g{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 16px;min-height:72px}
.g div{flex:1}.g h3{margin-bottom:3px}.g p{margin:0;font-size:14px;color:var(--mute)}
.g .t{font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.g.pri{border-left:0;box-shadow:inset 4px 0 0 var(--orange)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mute);margin:8px 0 4px}
.lead{font-size:17px;color:var(--mute);margin:6px 0 18px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.blk h3{margin-bottom:10px}.blk p{margin:0}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
ol.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--green);color:var(--app);font:700 15px/32px 'Space Grotesk',sans-serif;text-align:center}
ul.dots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.alert,.tip{display:grid;grid-template-columns:24px 1fr;gap:12px;border-radius:16px;padding:14px 16px;margin:12px 0}
.alert{background:var(--orange-soft);color:var(--ink)}.alert svg{color:var(--orange-deep)}
.tip{background:var(--green-soft)}.tip svg{color:var(--green)}
.alert b,.tip b{display:block;font-size:13px;margin-bottom:2px}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.num{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.num strong{display:block;font:700 34px/1 'Space Grotesk',sans-serif;color:var(--orange-deep);margin-bottom:6px}
.num span{display:block;font-weight:600}.num small{display:block;font-size:13px;color:var(--mute);margin-top:4px;line-height:1.4}
.num.big{grid-column:1/-1;background:var(--orange-deep);border-color:transparent;color:var(--on-orange)}.num.big strong,.num.big small{color:var(--on-orange)}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(0,38%) 1fr;gap:8px 14px}dl.kv dt{font-weight:600}dl.kv dd{margin:0;color:var(--mute)}
@media(max-width:380px){dl.kv{grid-template-columns:1fr}dl.kv dd{margin-bottom:6px}}
.chk .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}.chk .hd h3{margin:0;flex:1}
.prog{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--green-soft);overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--green);transition:width .25s}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-height:44px}
.chk input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--mute);border-radius:7px;margin:0;display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--green);border-color:var(--green)}
.chk input:checked::after{content:'';width:6px;height:11px;border:solid var(--app);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.chk input:checked+span{color:var(--mute);text-decoration:line-through}
.form label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.form input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--app);color:var(--ink);font:16px Inter,sans-serif;padding:0 12px}
.form .saved{font-size:12px;color:var(--mute);margin-top:10px}
details.risk{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0}
details.risk summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 17px 'Space Grotesk',sans-serif;min-height:52px}
details.risk summary::-webkit-details-marker{display:none}
details.risk summary::after{content:'+';font-size:24px;color:var(--orange-deep);line-height:1}details.risk[open] summary::after{content:'−'}
details.risk ul{margin:0;padding:0 16px 16px 36px;display:flex;flex-direction:column;gap:8px}
.calc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.calc button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--app);color:var(--ink);font:700 22px Inter;cursor:pointer}
.calc output{font:700 18px 'Space Grotesk';min-width:2ch;text-align:center}
.calc .res{margin-left:auto;font:700 28px 'Space Grotesk';color:var(--green);white-space:nowrap}
.dont li{list-style:none;display:grid;grid-template-columns:22px 1fr;gap:8px}.dont{padding:0;margin:0;display:flex;flex-direction:column;gap:8px}.dont li::before{content:'✕';color:var(--orange-deep);font-weight:700}
.src{margin-top:26px;font-size:13px;color:var(--mute)}.src h3{font-size:14px;margin-bottom:6px;color:var(--mute)}.src ul{margin:0;padding-left:18px}
.disc{font-size:13px;color:var(--mute);margin-top:28px;line-height:1.5}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.reset{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:10px;padding:10px 14px;font:600 14px Inter;cursor:pointer;min-height:44px;margin-top:12px}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>

ou de séisme, coupez aussi l'eau.","Ne pas prendre l'ascenseur : une coupure de courant peut vous bloquer.","Ne quitter votre domicile que sur ordre des autorités."]},{"t":"alert","body":"N'écoutez que les annonces officielles et ne relayez pas de rumeurs. Voir le guide « Résister à la désinformation »."}],"sources":["S2","S3","S4"]},{"id":"abri-evacuation","cat":"urgence","titre":"Se mettre à l'abri ou évacuer","resume":"Choisir la bonne pièce, ou le bon itinéraire.","duree":"3 min","prioritaire":true,"blocs":[{"t":"text","titre":"Mise à l'abri chez soi","body":"Respectez les consignes générales, prenez votre kit d'urgence et rejoignez le lieu de mise à l'abri que vous avez choisi à l'avance."},{"t":"list","titre":"Quelle pièce choisir ?","items":["Air pollué (accident industriel, nucléaire, camion-citerne) : une pièce avec le moins d'ouvertures possible, si possible à l'opposé du danger et proche des sanitaires. Avant d'y entrer, fermez portes et fenêtres et bouchez aérations et ventilations avec du ruban adhésif ou du tissu.","Inondation : un espace refuge en hauteur (étage, mezzanine) ou chez un voisin, accessible de l'intérieur et de l'extérieur pour les secours.","Si vous êtes loin de chez vous : entrez dans le bâtiment le plus proche et suivez les consignes."]},{"t":"text","titre":"Évacuation","body":"Le but est de s'éloigner de la source du danger, jamais de le braver. Exemple : ne traversez pas un cours d'eau en crue si un point haut existe dans votre logement."},{"t":"list","titre":"Où aller ?","items":["Séisme : éloignez-vous des bâtiments, des lignes électriques et des arbres.","Inondation, mouvement de terrain, rupture de barrage : le lieu peut être éloigné (gymnase, point haut de la commune). La mairie définit ces lieux à l'avance.","Testez à l'avance les itinéraires vers chaque point de rassemblement."]},{"t":"tip","body":"Animaux : ils ne sont pas toujours acceptés dans les lieux d'accueil. Si vous partez sans eux, mettez-les à l'abri en hauteur. Si vous les emmenez, prenez leur carnet de santé à jour."},{"t":"form","id":"lieux-abri","titre":"Mes lieux (à remplir)","fields":["Pièce de mise à l'abri chez moi","Lieu d'évacuation fixé par la commune","Itinéraire à emprunter","Itinéraire à éviter"]}],"sources":["S2","S4"]},{"id":"risques","cat":"urgence","titre":"Que faire selon le risque","resume":"Inondation, séisme, feu de forêt, accident industriel...","duree":"5 min","prioritaire":true,"blocs":[{"t":"risk","titre":"Inondation","items":["Ne prenez pas votre voiture : quelques centimètres d'eau suffisent à l'emporter.","Ne descendez pas dans les sous-sols ni les parkings souterrains.","Éloignez-vous des cours d'eau, des berges, des ponts et des fonds de vallée.","Réfugiez-vous le plus haut possible.","Coupez eau, gaz et électricité si vous pouvez le faire sans danger.","Reportez vos déplacements. N'évacuez que sur ordre des autorités.","Suivez Vigicrues et Météo-France."]},{"t":"risk","titre":"Feu de forêt","items":["Quittez le massif immédiatement ou abritez-vous dans un bâtiment en dur : vous y êtes plus en sécurité.","Bouchez aérations et bas de portes contre les fumées et les flammèches.","Couvrez-vous le nez et la bouche avec un linge humide.","En voiture surprise par le front de flammes : arrêtez-vous dans une zone dégagée et restez dans le véhicule.","N'évacuez que sur ordre des autorités."]},{"t":"risk","titre":"Séisme","items":["Pendant : abritez-vous près d'un mur porteur ou sous un meuble solide, loin des fenêtres.","Au rez-de-chaussée ou près d'une sortie : éloignez-vous du bâtiment et des lignes électriques.","En voiture : ne sortez pas, arrêtez-vous loin des bâtiments.","Après : sortez des bâtiments endommagés par les escaliers, éloignez-vous de ce qui peut s'effondrer.","Éloignez-vous des côtes : un séisme peut provoquer un tsunami."]},{"t":"risk","titre":"Tempête, orage, cyclone","items":["Abritez-vous dans un bâtiment en dur.","Ne restez pas sous un arbre isolé.","Fermez portes, fenêtres et volets, éloignez-vous des baies vitrées.","Cyclone : ne sortez pas pendant le passage de l'œil."]},{"t":"risk","titre":"Mouvement de terrain, avalanche","items":["Évitez le secteur.","Éloignez-vous des fortes pentes et des fonds de vallée."]},{"t":"risk","titre":"Rupture de barrage","items":["Évitez le périmètre et éloignez-vous des fonds de vallée.","Au signal « corne de brume » : évacuez et gagnez les points hauts."]},{"t":"risk","titre":"Tsunami","items":["Dès l'alerte, rejoignez un point haut ou éloignez-vous des côtes.","Ne prenez pas votre voiture. Coupez les réseaux si possible.","Ne quittez pas le site refuge sans autorisation."]},{"t":"risk","titre":"Éruption volcanique (outre-mer)","items":["Confinez-vous dans un bâtiment clos, fermez et consolidez portes, fenêtres et volets.","Respirez à travers un masque ou un linge humide si l'air est chargé de gaz ou de cendres.","Préparez-vous à évacuer sur ordre des autorités."]},{"t":"risk","titre":"Accident industriel","items":["Abritez-vous dans le bâtiment clos le plus proche. Si vous êtes en voiture, rejoignez un bâtiment.","Fermez portes et fenêtres, calfeutrez les ouvertures et coupez la ventilation.","Éloignez-vous des fenêtres.","Gêne respiratoire : respirez à travers un linge humide.","Ne fumez pas, évitez toute flamme ou étincelle."]},{"t":"risk","titre":"Accident nucléaire","items":["Anticipez : retirez vos comprimés d'iode (gratuits) en pharmacie.","Mettez-vous à l'abri dans un bâtiment, fermez et calfeutrez, coupez la ventilation.","Ne touchez pas aux objets restés dehors (véhicules par exemple).","Ne prenez l'iode que sur instruction du préfet."]},{"t":"risk","titre":"Transport de matières dangereuses","items":["Évitez le périmètre.","Sinon, abritez-vous dans un bâtiment clos tout proche, fermez tout et arrêtez la ventilation."]},{"t":"risk","titre":"Épidémie (grippe, COVID-19)","items":["Lavez-vous les mains plusieurs fois par jour (savon ou gel hydroalcoolique).","Mouchoirs à usage unique, couvrez-vous le nez et la bouche quand vous éternuez.","Aérez régulièrement et portez un masque.","Grippe aviaire : lavez-vous les mains après tout contact avec des animaux."]},{"t":"risk","titre":"Attaque terroriste","items":["1. S'échapper, et aider les autres à s'échapper.","2. Se cacher : s'enfermer, se barricader, mettre les téléphones en silencieux.","3. Alerter les secours (17 ou 112, 114 par SMS).","4. En dernier recours et à plusieurs : résister ou faire diversion en se protégeant (sac, vêtement enroulé autour de l'avant-bras)."]}],"sources":["S2","S3"]},{"id":"trousses","cat":"urgence","titre":"Trousses de premiers secours","resume":"Le contenu d'une trousse familiale, d'un IFAK et d'un trauma kit.","duree":"3 min","prioritaire":false,"blocs":[{"t":"alert","body":"Ces listes décrivent du matériel, pas des gestes. Le garrot, les pansements hémostatiques ou la canule demandent une formation. Formez-vous aux gestes qui sauvent (voir « Entraide et engagement »)."},{"t":"check","id":"trousse-famille","titre":"Trousse familiale","items":["Pansements et sparadrap","Compresses","Désinfectant ou alcool","Gel hydroalcoolique","Masques","Paracétamol","Antidiarrhéique","Pince à épiler et tire-tique","Thermomètre","Vos médicaments personnels"]},{"t":"check","id":"ifak","titre":"IFAK (kit individuel)","items":["Garrot tourniquet (type CAT ou à cliquet)","Pansement israélien","Pansement hémostatique","Chest seal (x2)","Pansement compressif","Compresses pour brûlures","Compresses stériles","Bandage cohésif","Pansements et strips de fermeture","Ciseaux paramédicaux","Gants nitrile","Marqueur permanent et lampe compacte","Canule de Guedel","Couverture de survie","Pince à épiler, tire-tique, épingles de sûreté","Bâtons lumineux, bandes réfléchissantes, sifflet","Antalgiques et antihistaminiques","Antiseptique et sérum physiologique en unidoses"]},{"t":"check","id":"trauma","titre":"Trauma kit (foyer ou véhicule)","items":["Ciseaux paramédicaux","Lampe avec pile de rechange","Gants nitrile de plusieurs tailles","Marqueur (noter l'heure de pose d'un garrot)","Écharpes triangulaires","Couvertures de survie","Garrot tourniquet","Pansements israéliens","Mèches hémostatiques","Compresses pour brûlures","Bandages cohésifs de plusieurs tailles","Compresses froides instantanées","Kit allergie (antihistaminiques, adrénaline auto-injectable)","Anti-diarrhéiques et anti-vomitifs","Antalgiques de plusieurs niveaux","Antibiotiques (uniquement sur prescription)"]},{"t":"tip","body":"Demandez conseil à votre pharmacien pour adapter la trousse à votre foyer, et vérifiez les dates de péremption deux fois par an."}],"sources":["S2","S4","S6","S8","S10","S11"]},{"id":"kit72h","cat":"preparer","titre":"Le kit d'urgence 72 h","resume":"De quoi tenir 3 jours chez soi ou en cas de départ.","duree":"5 min","prioritaire":true,"blocs":[{"t":"text","body":"Lors d'une catastrophe, les 72 premières heures sont souvent les plus difficiles : coupures d'électricité, de gaz et d'eau, routes impraticables. Les secours priorisent les cas graves. Un kit préparé à l'avance vous rend autonome et leur permet de se concentrer sur ceux qui en ont le plus besoin."},{"t":"list","titre":"Les 3 principes clés","items":["Boire et manger","Avoir chaud","Se soigner"]},{"t":"calc","titre":"Mon stock d'eau","body":"6 litres par personne, en bouteilles.","parPersonne":6,"unite":"litres"},{"t":"check","id":"kit-base","titre":"Matériel de base","items":["Radio à piles et piles de rechange","Lampe de poche et piles de rechange","Bougies, briquet ou allumettes","Chargeur de téléphone et batterie externe","Couteau multifonction","Ouvre-boîte","Réchaud","Savon"]},{"t":"check","id":"kit-eau","titre":"Eau et nourriture","items":["Eau potable : 6 L par personne","Conserves ne nécessitant pas de cuisson","Petits pots ou lait infantile 1er âge liquide prêt à l'emploi","Café, thé","Nourriture pour animaux","Pastilles de décontamination de l'eau (dernier recours)"]},{"t":"check","id":"kit-chaud","titre":"Rester au chaud","items":["Vêtements chauds","Couverture de survie"]},{"t":"check","id":"kit-sante","titre":"Santé","items":["Médicaments du quotidien et de secours","Lunettes de vue (paire de secours)","Trousse de premiers secours (alcool, gel, masques, pansements, compresses)"]},{"t":"check","id":"kit-docs","titre":"Documents et clés","items":["Photocopies des papiers d'identité et ordonnances dans une pochette étanche","Double des clés de la maison et de la voiture","Argent liquide (les distributeurs peuvent être en panne)"]},{"t":"check","id":"kit-temps","titre":"Passer le temps","items":["Livres","Jeux"]},{"t":"tip","body":"Rangez le kit dans un endroit facile d'accès et dites à vos proches où il se trouve. Vérifiez-le deux fois par an (péremption des médicaments et denrées, piles) et réapprovisionnez-le après chaque utilisation."},{"t":"form","id":"kit-lieu","titre":"Mon kit","fields":["Où est rangé mon kit ?","Date de constitution","Prochaine vérification"]}],"sources":["S1","S2","S3","S4"]},{"id":"pfms","cat":"preparer","titre":"Mon plan familial de mise en sûreté","resume":"Préparer sa famille en un seul endroit.","duree":"15 min","prioritaire":true,"blocs":[{"t":"text","body":"Le plan familial de mise en sûreté (PFMS) se prépare en famille. Il rassemble les risques qui vous concernent, les moyens d'alerte, les consignes, vos lieux de mise à l'abri et vos contacts. Remplissez-le ici : il reste stocké sur votre téléphone, disponible sans réseau."},{"t":"steps","titre":"1. Je m'informe sur mes risques","items":["Sur georisques.gouv.fr.","En mairie : le DICRIM (Document d'information communal sur les risques majeurs).","En préfecture : le DDRM (Dossier départemental des risques majeurs).","Lors d'un achat ou d'une location, l'« état des risques » est obligatoirement remis.","Partout en France, chacun est exposé au minimum aux tempêtes et aux accidents de transport de matières dangereuses."]},{"t":"form","id":"pfms-risques","titre":"Mes risques et le comportement adapté","fields":["Commune","Risque 1 et comportement","Risque 2 et comportement","Risque 3 et comportement","Risque 4 et comportement"]},{"t":"text","titre":"2. Je sais couper les réseaux","body":"Localisez les arrivées de gaz, d'électricité et d'eau, et expliquez à vos proches comment les couper (photos, schéma, bouton à actionner). Exemple : « Le tableau électrique est à l'entrée, basculer l'interrupteur rouge en bas à gauche. »"},{"t":"form","id":"pfms-reseaux","titre":"Couper les réseaux chez moi","fields":["Électricité : où et comment","Gaz : où et comment","Eau : où et comment"]},{"t":"form","id":"pfms-lieux","titre":"3. Mes lieux","fields":["Lieu de mise à l'abri dans le logement","Actions avant de le rejoindre","Lieu d'évacuation et de regroupement","Itinéraire à emprunter"]},{"t":"form","id":"pfms-contacts","titre":"4. Mes contacts","fields":["Mairie","Préfecture","Relais de quartier","Urgence électricité","Urgence gaz","Service des eaux","Assurance (nom, téléphone, n° de contrat)","Médecin de famille","École(s) des enfants","Hôpital","Point familial de contact (proche vivant ailleurs, à joindre si nous sommes séparés)"]},{"t":"tip","body":"Point familial de contact : choisissez un ami ou un proche habitant une autre localité. Si la famille est séparée, chacun l'appelle pour donner de ses nouvelles."},{"t":"text","titre":"5. Ma carte d'urgence","body":"Recopiez l'essentiel sur une carte pour chaque membre de la famille, à garder dans le portefeuille ou le cartable des enfants. Le PFMS est aussi utile face à une canicule ou une épidémie."}],"sources":["S3","S4","S2"]},{"id":"plan-evacuation","cat":"preparer","titre":"Préparer son plan d'évacuation","resume":"7 étapes pour partir vite et bien.","duree":"10 min","prioritaire":false,"blocs":[{"t":"check","id":"evac-1","titre":"1. Documentation","items":["Consulter le DICRIM et Géorisques","Imprimer une carte de ma zone"]},{"t":"check","id":"evac-2","titre":"2. Analyse familiale","items":["Lister les membres du foyer et leurs besoins médicaux (et animaux, voisins)","Noter le planning type de chacun"]},{"t":"check","id":"evac-3","titre":"3. Points de rassemblement et itinéraires","items":["Point 1 : près du domicile","Point 2 : dans le quartier","Point 3 : hors de la ville","Cartographier routes, stations-service, points d'eau et urgences"]},{"t":"check","id":"evac-4","titre":"4. Moyens d'évacuation","items":["Voiture : réservoir toujours au moins à moitié plein","À pied : chaussures de marche à côté du sac d'évacuation","Vélo : prévoir chambres à air, kit crevaison, pompe et outils"]},{"t":"check","id":"evac-5","titre":"5. Communication","items":["Liste des contacts d'urgence imprimée","Protocole convenu (SMS d'abord, puis téléphone)","Moyen alternatif : radio à piles, sifflets, talkies-walkies"]},{"t":"check","id":"evac-6","titre":"6. Kit d'urgence","items":["Sac prêt et accessible pour chaque personne"]},{"t":"check","id":"evac-7","titre":"7. Responsabilités","items":["Rôle de chacun avec sa check-list","Enfants formés aux bases","Procédure de coupure des réseaux connue de tous"]},{"t":"tip","body":"Partez avant les embouteillages de panique et connaissez plusieurs itinéraires de délestage."}],"sources":["S7","S11"]},{"id":"sac-evacuation","cat":"preparer","titre":"Le sac d'évacuation","resume":"Un sac par personne, prêt à partir.","duree":"5 min","prioritaire":false,"blocs":[{"t":"text","body":"Une catastrophe peut frapper au travail, sur la route ou au supermarché. L'idéal est d'avoir un sac à la maison, un au travail et un dans la voiture. Règle d'or : 1 personne = 1 sac, d'environ 40 litres, sans se surcharger (le sac complet ne devrait pas dépasser un douzième de votre poids)."},{"t":"check","id":"sac-admin","titre":"Administratif","items":["Copies des documents importants (papier et clé USB)","Argent liquide en petites coupures","Doubles des clés (domicile, véhicule, point de chute)","Bloc-notes et stylo","Liste des numéros importants","Photos plastifiées de vos proches (utiles en cas de séparation)"]},{"t":"check","id":"sac-sante","titre":"Santé et hygiène","items":["Lunettes de rechange","Médicaments courants et traitement personnel (plusieurs boîtes)","Trousse de secours compacte","Couverture de survie","Gel hydroalcoolique","Papier toilette et essuie-tout","Sacs poubelles","Brosse à dents et dentifrice","Protections périodiques, produits pour bébé si besoin"]},{"t":"check","id":"sac-vetements","titre":"Vêtements","items":["Un change complet adapté à la saison","Poncho de pluie","Gants","Bonnet ou casquette","Tour de cou","Chaussures solides posées à côté du sac"]},{"t":"check","id":"sac-eau","titre":"Eau","items":["Gourde filtrante remplie","Gourde souple 2 L","Poche à eau 5 à 10 L (vide)"]},{"t":"check","id":"sac-feu","titre":"Éclairage et feu","items":["2 briquets","Allumettes étanches","Lampe frontale","Bâtons lumineux"]},{"t":"check","id":"sac-energie","titre":"Énergie et communication","items":["Batterie externe haute capacité","Panneau solaire portable","Radio solaire ou à dynamo","Talkies-walkies"]},{"t":"check","id":"sac-outils","titre":"Outils","items":["Couteau suisse ou multi-outil","Paracorde","Ruban adhésif renforcé","Sifflet"]},{"t":"check","id":"sac-nourriture","titre":"Nourriture","items":["3 rations ne nécessitant pas de cuisson","Barres énergétiques","Couverts"]},{"t":"tip","body":"Rangez le sac loin d'un radiateur ou d'un tableau électrique, mettez ce qui craint l'eau dans des sacs étanches et adaptez les vêtements à chaque saison. Si un traitement doit rester au frais (insuline), placez un repère sur le sac pour ne pas l'oublier."}],"sources":["S12","S11","S10"]},{"id":"edc","cat":"preparer","titre":"Ce que j'ai toujours sur moi","resume":"L'« EDC » : le minimum du quotidien.","duree":"2 min","prioritaire":false,"blocs":[{"t":"check","id":"edc-1","titre":"Administratif et technologie","items":["Papiers d'identité et permis","Carte bancaire et un peu d'argent liquide","Smartphone","Batterie externe et câble"]},{"t":"check","id":"edc-2","titre":"Outils","items":["Outil multifonction ou couteau","Lampe de poche","Briquet","Sifflet","Carnet et stylo"]},{"t":"check","id":"edc-3","titre":"Santé","items":["Médicaments personnels","Antidouleur","Mouchoirs et petit sac poubelle","Gourde ou bouteille d'eau"]},{"t":"tip","body":"Un outil n'est utile que s'il est disponible. Si vous l'oubliez sans cesse à la maison, il est trop encombrant : choisissez plus léger. Préférez des couleurs vives, faciles à retrouver dans l'herbe."}],"sources":["S5","S11"]},{"id":"documents","cat":"preparer","titre":"Documents et argent de secours","resume":"Sauvegarder l'essentiel avant qu'il ne soit trop tard.","duree":"3 min","prioritaire":false,"blocs":[{"t":"check","id":"docs","titre":"À numériser et photocopier pour chaque membre du foyer","items":["Carte d'identité et passeport","Carte vitale","Permis de conduire et carte grise","Livret de famille","Carnets de santé (y compris des animaux) et ordonnances","RIB et références bancaires","Contrats d'assurance (habitation, auto, responsabilité civile)","Actes de propriété","Photos de l'intérieur et de l'extérieur du logement et des biens de valeur"]},{"t":"steps","titre":"Comment les conserver","items":["Photocopies dans une pochette étanche, dans le sac d'évacuation.","Copies numériques sur au moins 2 clés USB rangées dans des lieux différents.","Photos des biens de valeur confiées à des proches qui ne sont pas exposés aux mêmes risques : elles prouveront l'existence de vos biens auprès de l'assureur."]},{"t":"text","titre":"Argent liquide","body":"Les cartes bancaires et les distributeurs peuvent ne plus fonctionner. Gardez de l'argent liquide en petites coupures dans votre kit et votre sac. Certaines sources recommandent de quoi tenir au moins 2 semaines sans carte."}],"sources":["S4","S12","S2"]},{"id":"stocks","cat":"preparer","titre":"Stocks à la maison","resume":"Eau, nourriture, hygiène : tenir plusieurs semaines.","duree":"6 min","prioritaire":false,"blocs":[{"t":"text","body":"Sans électricité, plus d'eau dans les étages (les pompes sont électriques), plus de chauffage électrique, de cuisson, de réfrigérateur ni d'éclairage. Un supermarché contient au maximum 3 jours de stock pour sa zone, et les rayons peuvent être vides en 36 heures en cas de rupture d'approvisionnement."},{"t":"steps","titre":"Constituer son stock sans se ruiner","items":["Achetez un peu plus à chaque course (conserves, soupes, pâtes, farine, eau) et mettez ce surplus de côté.","Choisissez des aliments que vous aimez : le moral compte.","Préférez les conserves de 400 g aux grands formats (une boîte ouverte se consomme vite).","Faites tourner : consommez et remplacez les produits arrivés aux trois quarts de leur durée de vie.","Riz, pâtes, légumes secs, sel et sucre bien stockés se conservent très longtemps."]},{"t":"kv","titre":"Exemple de stock pour 2 adultes, 3 à 6 mois","items":[["Conserves","50 légumes, 50 poissons, 50 fruits, 20 plats à base de viande, 12 pâtés"],["Plats lyophilisés","50"],["Féculents","10 kg de riz, 10 kg de pâtes, 20 paquets de biscottes"],["Épicerie","5 kg de sucre, 3 L d'huile d'olive, 10 kg de sel, 5 kg de miel, 10 boîtes de bouillon, café, thé"],["Eau","Environ 270 L (par exemple 30 packs de 6 x 1,5 L)"]]},{"t":"text","titre":"Stocker l'eau","body":"Un filtre à eau permet de boire l'eau stockée ou d'origine douteuse. Pour de grandes quantités : fûts alimentaires nettoyés, isolés du sol par une planche, avec un produit stabilisant ou de la javel, et recouverts d'une bâche noire s'ils sont exposés à la lumière. Ainsi stockée, l'eau se conserve environ 1 an."},{"t":"check","id":"stock-hygiene","titre":"Hygiène et assainissement","items":["Sacs poubelles en grande quantité","Papier toilette","Toilettes d'appoint","Protections périodiques","Savon en pain et gel hydroalcoolique","Javel","Gants nitrile","Masques FFP2","Vinaigre blanc et bicarbonate de soude","Bâches transparentes et ruban adhésif","Trousse de secours grand format"]},{"t":"check","id":"stock-energie","titre":"Cuisiner, s'éclairer, se chauffer sans réseau","items":["Réchaud de camping et cartouches de gaz compatibles","Bougies longue durée","Lampes torches et lanternes","Couverture de laine ou sac de couchage par personne","Batterie externe et panneau solaire","Piles rechargeables et chargeur","Radio à manivelle ou solaire"]},{"t":"alert","body":"Réchaud, bougies, poêle à pétrole : aérez toujours la pièce. Un appareil à flamme en espace clos est dangereux."}],"sources":["S12","S11","S2"]},{"id":"incendie-domicile","cat":"preparer","titre":"Protéger son logement du feu","resume":"Détecteurs, extincteurs, couverture anti-feu.","duree":"2 min","prioritaire":false,"blocs":[{"t":"check","id":"feu-maison","titre":"Équipement conseillé","items":["Détecteur de fumée devant la cuisine","Détecteur dans le couloir principal","Détecteur devant chaque chambre éloignée","Extincteurs","Couverture anti-feu","Échelle de secours si vous vivez en étage","Masques de protection contre les fumées"]},{"t":"tip","body":"Rangez bijoux et objets précieux dans une boîte compacte, facile à emporter : on ne cherche pas ses affaires quand les rideaux brûlent."}],"sources":["S12"]},{"id":"vehicule","cat":"preparer","titre":"Mon véhicule, prêt à partir","resume":"Entretien et équipement du coffre.","duree":"3 min","prioritaire":false,"blocs":[{"t":"check","id":"auto-semaine","titre":"Chaque semaine","items":["Niveaux : huile, refroidissement, freins, lave-glace","Réservoir jamais sous la moitié","Pneus et roue de secours (état et pression)","Essuie-glaces","Feux et clignotants","Vitres et rétroviseurs propres"]},{"t":"check","id":"auto-coffre","titre":"Dans le coffre","items":["Outils de base, cric et démonte-pneu","Extincteur","Marteau brise-vitre avec coupe-ceinture","Huile, liquide de frein et de refroidissement","Bombe anti-crevaison","Lampe torche puissante","Gilets et triangle de signalisation","Fusibles et ampoules de rechange"]},{"t":"tip","body":"Garez-vous dans le sens du départ et gardez la clé de voiture sur un trousseau séparé : sous le stress, chaque seconde compte."}],"sources":["S11","S7"]},{"id":"communication","cat":"preparer","titre":"Communiquer sans réseau","resume":"Garder le lien quand téléphone et internet tombent.","duree":"3 min","prioritaire":false,"blocs":[{"t":"text","body":"Les réseaux téléphoniques et internet peuvent ne plus fonctionner. Convenez à l'avance d'un protocole avec vos proches."},{"t":"steps","titre":"Le protocole familial","items":["Identifiez les proches qui auront besoin d'aide et qui ira les voir.","Privilégiez les SMS, qui saturent moins les réseaux que les appels.","Désignez un point familial de contact vivant ailleurs.","Fixez un lieu de rendez-vous si personne n'est joignable.","Imprimez la liste des contacts : un téléphone peut tomber en panne."]},{"t":"list","titre":"Les moyens de secours","items":["Radio à piles, solaire ou à manivelle pour suivre les consignes.","Talkies-walkies à piles pour le foyer ou le groupe (portée de quelques kilomètres).","Sifflet pour attirer l'attention.","Couverture de survie accrochée en hauteur, qui reflète le soleil.","Marques laissées sur votre trajet si vous vous éloignez, après avoir prévenu quelqu'un."]},{"t":"tip","body":"Si vous n'avez plus accès à internet, rendez-vous au commissariat, à la gendarmerie ou à la mairie."}],"sources":["S2","S4","S7","S10","S12"]},{"id":"desinformation","cat":"preparer","titre":"Résister à la désinformation","resume":"4 questions avant de partager une information.","duree":"2 min","prioritaire":false,"blocs":[{"t":"text","body":"En temps de crise, des acteurs hostiles peuvent diffuser de fausses informations pour aggraver le désordre. À l'heure de l'intelligence artificielle, de fausses vidéos peuvent aussi circuler."},{"t":"steps","titre":"Avant de croire ou de partager","items":["Qui a envoyé cette information ?","La source est-elle officielle ?","Est-elle publiée par un grand média national ?","Quel est le but de cette information ?"]},{"t":"list","titre":"Hygiène numérique","items":["Mots de passe solides et mises à jour régulières.","Un antivirus, et de la méfiance envers les messages inattendus.","Vérifiez l'auteur et la date avant de rediffuser.","Signalez les contenus illicites sur internet-signalement.gouv.fr (Pharos).","Victime de cybermalveillance : 17cyber.gouv.fr et cybermalveillance.gouv.fr."]}],"sources":["S2"]},{"id":"engagement","cat":"preparer","titre":"Entraide et engagement","resume":"Se former, aider ses voisins, rejoindre une réserve.","duree":"3 min","prioritaire":false,"blocs":[{"t":"text","titre":"Se former aux gestes qui sauvent","body":"Les secours peuvent être débordés. Une formation aux premiers secours (massage cardiaque, défibrillateur, garrot tourniquet) vous permet de sauver des vies. Contactez votre commune ou une association agréée : Croix-Rouge, Protection civile, SNSM."},{"t":"list","titre":"Construire une entraide","items":["Votre premier cercle (famille, voisins, collègues) est la base de la solidarité.","Repérez les personnes isolées de votre immeuble ou de votre quartier.","Partagez ce guide avec vos proches."]},{"t":"list","titre":"S'engager","items":["Réserve communale de sécurité civile : renseignez-vous en mairie.","Sapeur-pompier volontaire : contactez le SDIS de votre département.","Bénévolat : jeveuxaider.gouv.fr.","Garde nationale et réserves des armées : reservistes.defense.gouv.fr.","Réserve sanitaire pour les professionnels de santé : reservesanitaire.fr.","Journée nationale de la résilience, chaque 13 octobre."]}],"sources":["S2","S3","S4"]},{"id":"priorites","cat":"survie","titre":"Les priorités de survie","resume":"Garder son calme et la règle des 3.","duree":"3 min","prioritaire":false,"blocs":[{"t":"kv","titre":"La règle des 3","items":[["3 heures","sans se protéger des intempéries"],["3 jours","sans boire"],["3 semaines","sans manger"],["3 mois","sans hygiène"]]},{"t":"steps","titre":"Face à une situation d'urgence","items":["Restez calme : votre cas n'est pas forcément désespéré. Respiration, humour ou pensées positives aident.","Analysez : matériel disponible, état physique et moral de chacun.","Fixez vos priorités : abri, eau, feu, puis nourriture.","Passez à l'action."]},{"t":"alert","body":"La faim, le froid, la chaleur, la douleur, la déshydratation, la fatigue et la peur réduisent fortement la capacité à réfléchir et à décider."},{"t":"list","titre":"Les vrais dangers","items":["L'erreur humaine : 2 secondes d'inattention suffisent pour chuter ou se tromper de chemin.","L'hypothermie, possible même sous 20 °C avec le vent, l'humidité et la déshydratation.","Les accidents imprévisibles : chute de pierres, foudre, arbre.","Le coup de chaleur, surtout s'il est combiné à la déshydratation.","La déshydratation.","La faim, qui affaiblit.","La solitude."]},{"t":"tip","body":"Avant une sortie : consultez la météo, emportez une carte, prévenez quelqu'un de votre trajet et de sa durée, prévoyez eau, nourriture et une petite trousse de survie."}],"sources":["S9","S10","S11"]},{"id":"eau","cat":"survie","titre":"Trouver et purifier l'eau","resume":"On ne tient que quelques jours sans boire.","duree":"4 min","prioritaire":false,"blocs":[{"t":"list","titre":"Où trouver de l'eau","items":["Rivières et points d'eau douce, au fond des vallées.","En creusant le lit d'une rivière asséchée.","Eau de pluie.","Rosée du matin.","Sac plastique fermé autour d'une branche feuillue (condensation).","Trou creusé dans le sol et recouvert d'une bâche ou d'un poncho."]},{"t":"steps","titre":"La méthode en 3 étapes","items":["Filtrer : un filtre fin retient les particules et une partie des micro-organismes. Filtre de fortune : tissu, sable ou terre, charbon de bois, bien tassés.","Faire bouillir quelques minutes, puis laisser refroidir.","Finir par une paille filtrante, une pastille de purification ou quelques gouttes de javel."]},{"t":"alert","body":"Doses de javel : les documents sources ne concordent pas (de 1 à 4 gouttes par litre). Suivez en priorité la notice des pastilles de purification."},{"t":"tip","body":"Nettoyez et renouvelez souvent l'eau des gourdes : une mauvaise odeur signale un développement bactérien."}],"sources":["S9","S10","S11","S12"]},{"id":"feu","cat":"survie","titre":"Faire du feu","resume":"Se réchauffer, cuire, purifier l'eau, se signaler.","duree":"3 min","prioritaire":false,"blocs":[{"t":"text","body":"Un feu a besoin de 3 éléments : du combustible, de l'oxygène et de la chaleur au départ."},{"t":"steps","titre":"Monter son feu","items":["Choisissez un endroit dégagé, loin des arbres et buissons.","Retirez herbes et feuilles mortes autour, entourez le foyer de pierres.","Démarrez avec un allume-feu : écorce de bouleau, herbe sèche, lichen, ou vaseline, gel hydroalcoolique.","Ajoutez des brindilles grosses comme un doigt, puis du bois de plus en plus gros.","Laissez de l'espace entre les branches pour que l'air circule.","Faites sécher le gros bois autour du foyer."]},{"t":"list","titre":"Sans briquet ni allumettes","items":["Friction : deux morceaux de bois frottés, par exemple avec un archet.","Percussion : silex contre acier, étincelles sur de l'amadou.","Loupe ou miroir concentrant le soleil sur une matière inflammable."]},{"t":"alert","body":"Un grand feu exige une surveillance permanente. Préférez de petits feux et respectez les interdictions locales : le but n'est jamais de déclencher un feu de forêt."}],"sources":["S9","S10"]},{"id":"abri","cat":"survie","titre":"Construire un abri","resume":"La première priorité : se protéger du froid et de la pluie.","duree":"3 min","prioritaire":false,"blocs":[{"t":"text","body":"L'hypothermie et le manque de sommeil sont les plus grands dangers en nature. Profitez d'abord d'un abri existant (grotte, cabane)."},{"t":"steps","titre":"Bien choisir l'emplacement","items":["Évitez les creux, où le froid s'accumule, et les lieux exposés au vent.","Ombre ou soleil selon vos besoins.","Proche des ressources : eau, bois.","Visible depuis un hélicoptère si vous attendez des secours.","Installez-vous bien avant la nuit."]},{"t":"steps","titre":"Construire","items":["Isolez le sol : feuilles mortes, mousse, herbes sèches, branches de sapin.","Le toit doit être imperméable.","Faites l'abri le plus petit possible et bien isolé pour garder la chaleur."]},{"t":"tip","body":"Bâche, poncho, couverture de survie, grand sac poubelle, couteau et ficelle suffisent à faire un abri de fortune. Un poncho sert à la fois de vêtement de pluie, de bâche et d'abri."}],"sources":["S9","S10","S11"]},{"id":"orientation","cat":"survie","titre":"S'orienter et se retrouver","resume":"Trouver le nord sans GPS.","duree":"3 min","prioritaire":false,"blocs":[{"t":"steps","titre":"Si vous êtes perdu","items":["Gardez votre calme, ne foncez pas tête baissée.","Revenez sur vos pas.","Repérez-vous sur la carte grâce aux points remarquables.","Restez sur les sentiers, pas sur les passages d'animaux."]},{"t":"list","titre":"Trouver le nord","items":["Le soleil se lève à l'est, se couche à l'ouest et passe au sud à midi (comme la lune).","Avec une montre à aiguilles : pointez l'aiguille des heures vers le soleil, le sud est à mi-chemin entre elle et midi.","Les arbres isolés ont souvent des branches plus horizontales côté sud.","La mousse n'est pas un indicateur fiable."]},{"t":"tip","body":"Boussole et carte papier de votre région restent les outils les plus sûrs. Le téléphone et le GPS aident, mais la batterie et le réseau peuvent lâcher."}],"sources":["S9","S10","S11"]},{"id":"signaux","cat":"survie","titre":"Se signaler aux secours","resume":"Feu, sifflet, lumière, signaux au sol.","duree":"2 min","prioritaire":false,"blocs":[{"t":"list","titre":"Les signaux de détresse","items":["3 feux en triangle d'environ 30 m de côté. Le jour, ajoutez des végétaux frais pour faire de la fumée. La nuit, privilégiez les flammes.","Sifflet : le signal SOS en morse est 3 courts, 3 longs, 3 courts.","Lumière : lampe la nuit, miroir ou surface réfléchissante le jour.","Les deux bras levés signifient « besoin d'aide ».","Signaux tracés au sol avec des branches dans une zone dégagée."]},{"t":"check","id":"signal-kit","titre":"Pour me signaler","items":["Sifflet","Lampe clignotante","Tissu ou panneau « SOS » de couleur vive","Gilets fluorescents","Couverture de survie"]}],"sources":["S9","S4","S10"]},{"id":"cueillette","cat":"survie","titre":"Cueillette de plantes sauvages","resume":"4 plantes communes et les règles de sécurité.","duree":"4 min","prioritaire":false,"blocs":[{"t":"alert","body":"Ne consommez que ce que vous avez identifié avec certitude : la flore compte des espèces mortelles. En cas de doute, demandez à un spécialiste. Mieux vaut connaître parfaitement une quinzaine de plantes que d'en confondre cent."},{"t":"list","titre":"Les règles","items":["Évitez les zones polluées (bords de route, passages d'animaux).","Ne prenez que le nécessaire, uniquement des plantes abondantes et non protégées.","Cuisez ou lavez très bien les plantes contre les parasites.","Commencez par de petites quantités.","Transportez-les dans du tissu ou du papier plutôt que du plastique."]},{"t":"plant","titre":"Plantain","items":[["Où","Prairies, champs"],["Quand","Toute l'année"],["Manger","Feuilles en salade ou en légume, jeunes fleurs au goût de champignon"],["Soigner","Cicatrisant, contre la toux. Feuilles écrasées sur les piqûres d'insectes et d'orties"]]},{"t":"plant","titre":"Tussilage","items":[["Où","Sols instables, milieux humides"],["Quand","Fleurs de mars à mai, feuilles d'avril à septembre"],["Manger","Jeunes feuilles et fleurs en salade, feuilles âgées cuites"],["Soigner","Feuilles et fleurs contre la toux"]]},{"t":"plant","titre":"Ortie","items":[["Où","Sols riches"],["Quand","Mars à novembre"],["Manger","Feuilles et graines cuites, jeunes feuilles hachées en salade"],["Autre","Ses fibres donnent une ficelle résistante"]]},{"t":"plant","titre":"Massette","items":[["Où","Étangs, marais"],["Quand","Pousses de mars à juin, fleurs femelles en juin et juillet, rhizome de novembre à mars"],["Manger","Rhizome riche en amidon, jeunes pousses crues, pollen riche en protéines, jeunes fleurs femelles comme un épi de maïs"]]},{"t":"tip","body":"La cueillette de champignons n'est pas couverte par les documents sources : ce module reste à créer avec un référent mycologue ou un pharmacien."}],"sources":["S9","S10"]},{"id":"nourriture","cat":"survie","titre":"Se nourrir sur la durée","resume":"Pêche, conservation, potager.","duree":"3 min","prioritaire":false,"blocs":[{"t":"text","body":"En Europe, le risque de mourir de faim en nature est presque inexistant : on tient plusieurs semaines sans manger, mais le manque affaiblit. La cueillette devrait constituer la base."},{"t":"list","titre":"Protéines","items":["Les petits invertébrés sont la source la plus simple : sauterelles, grillons, escargots, vers de terre.","La pêche demande un permis, ou une autorisation pour la nasse et le filet.","La chasse et le piégeage sont strictement encadrés par la loi et la plupart des animaux sont protégés.","Cuisez toujours viande et poisson : ils transmettent des maladies."]},{"t":"list","titre":"Conserver","items":["Riz, haricots secs et blé se gardent des années.","Mise sous vide, sachets absorbeurs d'oxygène et déshumidificateurs.","Pot en terre « zeer » pour garder au frais sans électricité, séchage de la viande."]},{"t":"list","titre":"Produire","items":["Le potager coûte moins d'énergie que la recherche de nourriture.","Gardez quelques sachets de graines dans votre sac, en évitant les variétés hybrides F1 qui ne se ressèment pas.","Les graines et engrais se conservent longtemps."]}],"sources":["S9","S10","S11"]},{"id":"hygiene","cat":"survie","titre":"Hygiène sans eau courante","resume":"Rester en bonne santé quand les toilettes ne marchent plus.","duree":"3 min","prioritaire":false,"blocs":[{"t":"text","body":"Une mauvaise hygiène favorise les bactéries, et la moindre coupure peut s'infecter. Ne la négligez pas, même en économisant l'eau."},{"t":"list","titre":"Les bons gestes","items":["Lavez-vous régulièrement, au gant de toilette pour économiser l'eau. Le savon de Marseille sert aussi de lessive.","Gel hydroalcoolique pour les mains.","En ville sans toilettes : faites vos besoins dans des sacs plastiques que vous jetterez ensuite.","En nature : loin du campement et jamais près d'une source d'eau.","Gants pour toute manipulation de déchets.","Désinfectez à la javel toilettes et poignées.","Changez de vêtements régulièrement et réparez les accrocs au fur et à mesure."]}],"sources":["S10","S11","S12"]},{"id":"trousse-survie","cat":"survie","titre":"Trousse de survie nature","resume":"Le petit kit à emporter même en balade.","duree":"2 min","prioritaire":false,"blocs":[{"t":"check","id":"survie-trousse","titre":"Contenu","items":["Briquet ou allumettes","Couteau","Ficelle ou paracorde","Couverture de survie","Bougie","Système de filtration ou de désinfection de l'eau","Sifflet","Boussole","Petite trousse de pharmacie","Mouchoirs","Sacs plastiques","Fil de pêche et hameçons","Scie-fil","Fil et aiguilles"]},{"t":"check","id":"survie-vetements","titre":"Toujours dans le sac","items":["Vêtements chauds et imperméables","Poncho","Eau","Nourriture","Carte de la zone"]},{"t":"tip","body":"Le matériel ne remplace pas la technique. Entraînez-vous : savoir faire un nœud ou un feu s'apprend avant l'urgence."}],"sources":["S9","S11"]},{"id":"retour","cat":"apres","titre":"Rentrer chez soi","resume":"Quand et comment réintégrer son logement.","duree":"3 min","prioritaire":false,"blocs":[{"t":"steps","titre":"Les étapes","items":["Ne rentrez qu'avec l'accord des autorités.","Odeur de gaz : éloignez-vous et appelez les secours ou l'urgence gaz.","Si vous étiez hébergé ailleurs qu'en centre d'accueil, prévenez la mairie de votre retour.","Logement très endommagé : déclarez le sinistre à votre assureur et attendez l'expert avant de nettoyer."]},{"t":"list","titre":"En attendant l'expert (si le logement est sûr)","items":["Aérez, remettez le chauffage en route si l'installation est sèche.","Prenez des photos intérieur et extérieur, marquez les hauteurs d'eau.","Listez meubles et appareils endommagés, sans rien jeter.","Vérifiez l'état des aliments, surtout les surgelés.","Signalez vos besoins à la mairie."]},{"t":"list","titre":"Après le passage de l'expert","items":["Nettoyez avec des gants, désinfectez à l'eau de Javel.","Chauffez pour sécher après une inondation.","Ne touchez jamais aux animaux morts ni aux produits chimiques abandonnés : prévenez la mairie."]}],"sources":["S4"]},{"id":"assurance","cat":"apres","titre":"Assurance et catastrophe naturelle","resume":"Les délais à ne pas manquer.","duree":"2 min","prioritaire":false,"blocs":[{"t":"text","body":"Vous n'êtes indemnisé au titre des catastrophes naturelles que si la commune est reconnue en état de catastrophe naturelle par un arrêté interministériel."},{"t":"steps","titre":"La démarche","items":["Dès le sinistre, signalez-vous au maire pour qu'il demande la reconnaissance en préfecture.","En parallèle, déclarez au plus vite les dégâts à votre assureur et dressez-en la liste.","Après publication de l'arrêté au Journal officiel, vous avez 10 jours pour déclarer les dommages matériels directs, 30 jours pour les pertes d'exploitation.","L'assureur doit verser l'indemnité dans les 3 mois suivant la remise de l'état estimatif des pertes."]},{"t":"text","titre":"Le soutien de la commune","body":"Si la commune a un Plan communal de sauvegarde, elle peut ouvrir un point d'accueil, aider à refaire les papiers, orienter vers les assureurs et, si besoin, fournir hébergement, eau et nourriture."},{"t":"form","id":"assureur","titre":"Mon assureur","fields":["Nom de l'assurance","Téléphone","Numéro de contrat"]}],"sources":["S4"]},{"id":"moral","cat":"apres","titre":"Prendre soin du moral","resume":"Après le choc, parler et se faire accompagner.","duree":"2 min","prioritaire":false,"blocs":[{"t":"list","items":["Le stress d'une crise laisse des traces, même chez ceux qui semblent bien l'avoir vécue.","Mettre des mots sur ce qui a été vécu évite le repli sur soi.","Un suivi psychologique peut être proposé : n'hésitez pas à l'accepter.","Repas chauds, jeux, lecture et contacts réguliers soutiennent le moral pendant l'attente.","Pour les enfants : une peluche et des jeux calmes."]}],"sources":["S13","S11","S12"]},{"id":"cellule-crise","cat":"mairie","titre":"Organiser une cellule de crise","resume":"Structure, rôles et méthode en 4 étapes.","duree":"6 min","prioritaire":false,"blocs":[{"t":"text","body":"Une crise est une situation où l'organisation habituelle ne suffit plus à absorber les impacts et la multiplicité des acteurs. On ne la prévient pas : on se prépare à l'affronter."},{"t":"kv","titre":"Les 4 piliers de la préparation","items":[["Organisation","Une gouvernance, une organisation agile"],["Processus","Préparation, alerte, mobilisation, pilotage, sortie, RETEX"],["Méthode","Simple, connue et appropriée par tous"],["Outils","Éprouvés, y compris en mode dégradé"]]},{"t":"steps","titre":"La méthode en 4 étapes","items":["Établir les faits : qui, quoi, quand, où, comment, effets, mesures prises, premiers impacts, personnes présentes.","Analyser les impacts immédiats et futurs : personnes, activités, image, responsabilité, environnement, finances.","Lister les parties prenantes : impliquées, impactées, à informer.","Bâtir le plan d'actions : chaque action a un responsable, une échéance, une priorité et un suivi."]},{"t":"list","titre":"Les rôles clés","items":["Directeur de crise : fixe la stratégie et les priorités, décide, valide les communications.","Directeur adjoint : anime la méthode, suit le plan d'actions, tient les délais.","Communication : messages, éléments de langage, veille médiatique.","Historien : tient la main courante (elle peut servir de pièce juridique).","Rédacteur du plan d'actions.","Liaison terrain.","Anticipation : imagine les évolutions possibles. Le pire est toujours possible.","Logistique, juridique, ressources humaines, experts selon la crise."]},{"t":"check","id":"crise-outils","titre":"Outils à préparer","items":["Manuel de crise et fiches réflexes","Annuaire de crise avec suppléants","Main courante","Tableau de situation","Chronogramme","Salle de crise équipée","Salle de repli sur un autre site","Moyens de communication alternatifs","Mallette d'astreinte"]},{"t":"tip","body":"Une équipe formée avec du papier, des stylos et un téléphone sera toujours plus efficace qu'une équipe non formée équipée d'un logiciel sophistiqué."}],"sources":["S13"]},{"id":"pilotage","cat":"mairie","titre":"Piloter la crise","resume":"Alerte, briefing, points de situation.","duree":"5 min","prioritaire":false,"blocs":[{"t":"text","titre":"Faut-il activer la cellule ?","body":"Posez 3 questions. L'organisation habituelle gère-t-elle tous les impacts ? Toutes les parties prenantes ? Les services sont-ils coordonnés ? Un seul « non » justifie la mobilisation. En cas de doute, mobilisez : c'est le principe de réponse prudente."},{"t":"steps","titre":"Le briefing initial","items":["Tour de table, rappel des rôles et des règles (validation, confidentialité, discipline).","Vérification des outils.","Constat de la situation et recueil des faits au tableau.","Impacts immédiats et cartographie des parties prenantes.","Évolutions possibles et périmètre d'action de la cellule.","Ressources mobilisables et objectifs de sortie de crise.","Premier plan d'actions validé par le directeur.","Messages prioritaires et heure du prochain point."]},{"t":"steps","titre":"Le point de situation (10 minutes maximum)","items":["Évolution des faits, des impacts, des parties prenantes.","Statut de chaque action : non engagée, en cours, terminée, bloquée.","Nouvelles orientations du directeur.","Heure du prochain point."]},{"t":"alert","body":"Le point de situation n'est pas un débat : c'est une mise à jour courte, à heure fixe."},{"t":"list","titre":"Pièges humains à connaître","items":["Biais d'optimisme : se croire moins exposé que les autres.","Biais de confirmation : retenir ce qui confirme son hypothèse.","Biais de narration : reconstruire une histoire trop logique.","Pilotage à l'oral, sans trace écrite.","Stress excessif, fatigue : prévoir les relèves."]}],"sources":["S13"]},{"id":"com-crise","cat":"mairie","titre":"Communiquer en crise","resume":"Informer la population, juste et vite.","duree":"5 min","prioritaire":false,"blocs":[{"t":"kv","titre":"La trame d'un message","items":[["Faits","Ce qui s'est passé, vérifié"],["Actes","Les mesures prises"],["Empathie","La compassion envers les personnes touchées"],["Engagement","Ce que vous allez faire"],["Transparence","Ce que vous savez et ne savez pas"]]},{"t":"list","titre":"Les bons principes","items":["Communiquez vite, uniquement des informations vérifiées.","Ne vous engagez pas sur une date précise de retour à la normale.","Informez régulièrement et occupez l'espace avant les rumeurs.","Ton pédagogique et rassurant, sans termes anxiogènes, adapté au public.","Informez d'abord vos agents, puis la population.","Prévoyez des canaux alternatifs si les canaux habituels sont coupés.","Gelez les publications programmées sur les réseaux sociaux.","Centralisez les demandes de la presse."]},{"t":"dodont","titre":"Les pièges","dont":["Le silence : il nourrit la rumeur.","Le déni ou les déclarations faussement rassurantes.","Le manque d'empathie ou d'humilité.","Accuser autrui.","Le mensonge : perte de confiance et sanctions."]},{"t":"check","id":"cyber-avant","titre":"Crise cyber : avant","items":["Faire se rencontrer équipes communication et informatique","Préparer des scénarios (rançongiciel, saturation, défiguration du site)","Constituer une boîte à outils de communication de crise","Participer à un exercice de crise cyber","Entraîner les porte-parole face aux médias"]},{"t":"check","id":"cyber-apres","titre":"Crise cyber : après","items":["Remercier les équipes","Faire un retour d'expérience sur la communication","Partager un témoignage public","Sensibiliser les agents aux bonnes pratiques"]}],"sources":["S13","S14"]},{"id":"exercice-retex","cat":"mairie","titre":"Exercices et retour d'expérience","resume":"S'entraîner, puis apprendre de chaque crise.","duree":"4 min","prioritaire":false,"blocs":[{"t":"kv","titre":"4 types d'exercices","items":[["Partiel","Tester une procédure, en peu de temps"],["Sur table","Tester sans moyens terrain les scénarios difficiles à simuler (nucléaire, NRBC)"],["Général","Tester l'ensemble du dispositif, avec plusieurs acteurs"],["Terrain","Conditions réelles, mobilisation des astreintes"]]},{"t":"steps","titre":"Préparer un exercice","items":["Partir d'un état des lieux.","Fixer objectifs et publics visés.","Écrire un scénario et une chronologie crédibles : chaque incident simulé sert un objectif.","Préférer un format pédagogique à un format trop stressant.","Débriefer à chaud, puis rédiger un rapport selon les 4 piliers."]},{"t":"kv","titre":"Le retour d'expérience (RETEX)","items":[["À chaud","Juste après la crise, avec la cellule : tour de table, à l'oral"],["À froid","Une fois la crise résolue, avec tous les acteurs : questionnaire anonyme, entretiens, écrit"]]},{"t":"tip","body":"Un bon RETEX met en avant les faiblesses : techniques, organisationnelles et humaines. Il met à jour le plan de crise sans figer la réponse, car la prochaine crise sera différente."}],"sources":["S13"]}]}</script>
<script>
{
const D=JSON.parse(document.getElementById('data').textContent);
const main=document.getElementById('main'),backBtn=document.getElementById('back');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('sj:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sj:'+k,JSON.stringify(v))}catch(e){}}};
const IC={
alerte:'<path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/>',
sac:'<path d="M8 7V5a4 4 0 018 0v2"/><rect x="4" y="7" width="16" height="14" rx="4"/><path d="M9 13h6"/>',
tente:'<path d="M12 3L2 20h20L12 3z"/><path d="M12 11l-3.5 9M12 11l3.5 9"/>',
maison:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
mairie:'<path d="M3 9l9-5 9 5"/><path d="M4 20h16M6 10v8M10 10v8M14 10v8M18 10v8"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
phone:'<path d="M5 3h4l2 5-3 2a12 12 0 006 6l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 5a2 2 0 012-2z"/>',
warn:'<path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
chev:'<path d="M9 6l6 6-6 6"/>'};
const icon=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const catById=Object.fromEntries(D.categories.map(c=>[c.id,c]));
const guideById=Object.fromEntries(D.guides.map(g=>[g.id,g]));
const textOf=g=>[g.titre,g.resume,...g.blocs.flatMap(b=>[b.titre,b.body,...(b.items||[]).flat().map(i=>typeof i==='object'?Object.values(i).join(' '):i),...(b.fields||[]),...(b.dont||[])])].join(' ').toLowerCase();
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const IDX=D.guides.map(g=>[g,norm(textOf(g))]);
const gItem=g=>`<a class="g${g.prioritaire?' pri':''}" href="#guide-${g.id}"><div><h3>${esc(g.titre)}</h3><p>${esc(g.resume)}</p></div><span class="t">${esc(g.duree)}</span>${icon('chev',20)}</a>`;

function home(q=''){
  const counts=D.categories.map(c=>D.guides.filter(g=>g.cat===c.id).length);
  main.innerHTML=`<div class="view">
  <h1>Vos guides, même sans réseau</h1>
  <a class="sos" href="#urgence"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC.phone}</svg><div><strong>Urgence</strong><span>Numéros, alerte et réflexes immédiats</span></div></a>
  <div class="search">${icon('search',20)}<label for="q" class="mute" style="position:absolute;left:-9999px">Rechercher un guide</label><input id="q" type="search" placeholder="Rechercher : eau, inondation, kit..." value="${esc(q)}" autocomplete="off"></div>
  <div id="res"></div></div>`;
  const input=document.getElementById('q'),res=document.getElementById('res');
  const draw=()=>{const v=norm(input.value.trim());
    if(v){const hits=IDX.filter(([,t])=>v.split(/\s+/).every(w=>t.includes(w))).map(([g])=>g);
      res.innerHTML=`<p class="sect">${hits.length} résultat${hits.length>1?'s':''}</p>`+(hits.length?`<div class="glist">${hits.map(gItem).join('')}</div>`:`<p class="empty">Aucun guide ne correspond. Essayez un autre mot.</p>`);return}
    res.innerHTML=`<div class="cats">${D.categories.map((c,i)=>`<a class="cat${c.id==='urgence'?' urg':''}${c.id==='mairie'?' wide':''}" href="#cat-${c.id}"><span class="ic">${icon(c.icone,26)}</span><div><h2>${esc(c.titre)}</h2><p>${esc(c.desc)}</p>${c.id==='mairie'?`<small>${counts[i]} guides</small>`:''}</div>${c.id!=='mairie'?`<small>${counts[i]} guides</small>`:''}</a>`).join('')}</div>
    <p class="sect">À préparer en priorité</p><div class="glist">${D.guides.filter(g=>g.prioritaire&&g.cat==='preparer').map(gItem).join('')}</div>
    <p class="disc">${esc(D.meta.avertissement)}</p>`};
  input.addEventListener('input',draw);draw();
}
function cat(id){
  const c=catById[id];if(!c)return home();
  const gs=D.guides.filter(g=>g.cat===id);
  main.innerHTML=`<div class="view"><span class="pill">${icon(c.icone,18)} ${gs.length} guides</span><h1>${esc(c.titre)}</h1><p class="lead">${esc(c.desc)}</p><div class="glist">${gs.map(gItem).join('')}</div></div>`;
}
function urgence(){
  const ids=['numeros','alerte','reflexes','abri-evacuation','risques','trousses'];
  const n=guideById.numeros.blocs[0].items;
  main.innerHTML=`<div class="view"><h1>Urgence</h1><p class="lead">Appelez, mettez-vous à l'abri, écoutez la radio.</p>
  <div class="nums">${n.slice(0,4).map((x,i)=>`<a class="num${i===0?' big':''}" href="tel:${esc(x.n)}"><strong>${esc(x.n)}</strong><span>${esc(x.label)}</span>${i===0?`<small>${esc(x.desc)}</small>`:''}</a>`).join('')}</div>
  <p class="sect">Guides d'urgence</p><div class="glist">${ids.map(i=>gItem(guideById[i])).join('')}</div></div>`;
}
const B={
text:b=>`<div class="blk">${b.titre?`<h3>${esc(b.titre)}</h3>`:''}<p>${esc(b.body)}</p></div>`,
steps:b=>`<div class="blk">${b.titre?`<h3>${esc(b.titre)}</h3>`:''}<ol class="steps">${b.items.map(i=>`<li><span>${esc(i)}</span></li>`).join('')}</ol></div>`,
list:b=>`<div class="blk">${b.titre?`<h3>${esc(b.titre)}</h3>`:''}<ul class="dots">${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`,
alert:b=>`<div class="alert" role="note">${icon('warn')}<div><b>Attention</b>${esc(b.body)}</div></div>`,
tip:b=>`<div class="tip" role="note">${icon('info')}<div><b>Bon à savoir</b>${esc(b.body)}</div></div>`,
numbers:b=>`<div class="nums">${b.items.map((x,i)=>`<a class="num${i===0?' big':''}" href="tel:${esc(x.n)}"><strong>${esc(x.n)}</strong><span>${esc(x.label)}</span><small>${esc(x.desc)}</small></a>`).join('')}</div>`,
kv:b=>`<div class="blk">${b.titre?`<h3>${esc(b.titre)}</h3>`:''}<dl class="kv">${b.items.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`,
plant:b=>B.kv(b),
risk:b=>`<details class="risk"><summary>${esc(b.titre)}</summary><ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></details>`,
dodont:b=>`<div class="blk"><h3>${esc(b.titre)}</h3><ul class="dont">${b.dont.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`,
check:b=>{const st=store.get('c:'+b.id,[]);const done=b.items.filter((_,i)=>st.includes(i)).length;
  return `<div class="blk chk" data-chk="${esc(b.id)}" data-n="${b.items.length}"><div class="hd"><h3>${esc(b.titre)}</h3><span class="prog">${done}/${b.items.length}</span></div><div class="bar"><i style="width:${Math.round(done/b.items.length*100)}%"></i></div>${b.items.map((it,i)=>`<label><input type="checkbox" data-i="${i}"${st.includes(i)?' checked':''}><span>${esc(it)}</span></label>`).join('')}</div>`},
form:b=>{const st=store.get('f:'+b.id,{});return `<form class="blk form" data-form="${esc(b.id)}"><h3>${esc(b.titre)}</h3>${b.fields.map((f,i)=>`<label for="${esc(b.id)}-${i}">${esc(f)}</label><input id="${esc(b.id)}-${i}" data-i="${i}" value="${esc(st[i]||'')}" autocomplete="off">`).join('')}<p class="saved">Enregistré uniquement sur cet appareil.</p></form>`},
calc:b=>{const p=store.get('persons',2);return `<div class="blk" data-calc="${b.parPersonne}"><h3>${esc(b.titre)}</h3><p>${esc(b.body)}</p><div class="calc"><button type="button" data-d="-1" aria-label="Une personne de moins">−</button><output aria-live="polite">${p}</output><button type="button" data-d="1" aria-label="Une personne de plus">+</button><span class="mute">personne(s)</span><span class="res">${p*b.parPersonne} L</span></div></div>`}
};
function guide(id){
  const g=guideById[id];if(!g)return home();
  const c=catById[g.cat];
  main.innerHTML=`<div class="view"><a class="pill" href="#cat-${c.id}" style="text-decoration:none">${icon(c.icone,18)} ${esc(c.titre)}</a><h1>${esc(g.titre)}</h1><p class="lead">${esc(g.resume)} <span style="white-space:nowrap">· ${esc(g.duree)} de lecture</span></p>
  ${g.blocs.map(b=>(B[b.t]||(()=>''))(b)).join('')}
  ${g.blocs.some(b=>b.t==='check')?`<button class="reset" type="button" id="reset">Tout décocher</button>`:''}
  <div class="src"><h3>Sources</h3><ul>${g.sources.map(s=>`<li>${esc(D.meta.sources[s]||s)}</li>`).join('')}</ul></div></div>`;
  main.querySelectorAll('[data-chk]').forEach(box=>{const id=box.dataset.chk,n=+box.dataset.n;
    box.addEventListener('change',()=>{const on=[...box.querySelectorAll('input:checked')].map(x=>+x.dataset.i);store.set('c:'+id,on);
      box.querySelector('.prog').textContent=on.length+'/'+n;box.querySelector('.bar i').style.width=Math.round(on.length/n*100)+'%'})});
  main.querySelectorAll('[data-form]').forEach(f=>{const id=f.dataset.form;f.addEventListener('submit',e=>e.preventDefault());
    f.addEventListener('input',()=>{const o={};f.querySelectorAll('input').forEach(x=>{o[x.dataset.i]=x.value});store.set('f:'+id,o)})});
  main.querySelectorAll('[data-calc]').forEach(el=>{const per=+el.dataset.calc;el.addEventListener('click',e=>{const d=+e.target.dataset.d;if(!d)return;
    const p=Math.max(1,Math.min(20,store.get('persons',2)+d));store.set('persons',p);el.querySelector('output').textContent=p;el.querySelector('.res').textContent=p*per+' L'})});
  const r=document.getElementById('reset');if(r)r.addEventListener('click',()=>{g.blocs.filter(b=>b.t==='check').forEach(b=>store.set('c:'+b.id,[]));guide(id)});
}
function route(){
  const h=location.hash.slice(1);
  backBtn.hidden=!h;
  if(h.startsWith('guide-'))guide(h.slice(6));
  else if(h.startsWith('cat-'))cat(h.slice(4));
  else if(h==='urgence')urgence();
  else home();
  window.scrollTo(0,0);
}
backBtn.addEventListener('click',()=>{const h=location.hash.slice(1);
  if(h.startsWith('guide-')){const g=guideById[h.slice(6)];location.hash=g?'cat-'+g.cat:''}else location.hash=''});
window.addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
