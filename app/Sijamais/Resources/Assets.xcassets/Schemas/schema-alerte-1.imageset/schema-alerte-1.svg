<title id="t">Les signaux d'alerte</title>
<desc id="d">L'alerte : trois sons modulés de 1 minute 41 secondes séparés de 5 secondes ; la fin d'alerte : un son continu de 30 secondes ; la corne de brume des barrages : 2 secondes de son et 3 de pause pendant 2 minutes.</desc>
