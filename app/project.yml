# Description du projet Xcode, lue par XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Régénérer le projet après un ajout de fichier : xcodegen generate (dans le dossier app).
name: Sijamais
options:
  bundleIdPrefix: fr.sijamais
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SijamaisKit:
    path: SijamaisKit
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 7.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sijamais:
    type: application
    platform: iOS
    sources:
      - path: Sijamais
        excludes:
          - "Resources/Cartes/**"
          - "Premium.storekit"
      # Code partagé avec l'extension de widgets (compte à rebours du retour).
      - path: Partage
      # Dossier copié tel quel dans l'application (polices, style et fichier de carte .pmtiles).
      - path: Sijamais/Resources/Cartes
        type: folder
        buildPhase: resources
    dependencies:
      - package: SijamaisKit
        product: SijamaisCore
      - package: MapLibre
        product: MapLibre
      # Extension : compte à rebours du retour sur l'écran verrouillé et dans la Dynamic Island.
      - target: SijamaisWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sijamais.app
        PRODUCT_NAME: Sijamais
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SIJAMAIS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "SIJAMAIS affiche votre position sur la carte hors ligne. Elle reste sur votre téléphone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  SijamaisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SijamaisWidgets
      - path: Partage
    info:
      path: SijamaisWidgets/Info.plist
      properties:
        CFBundleDisplayName: SIJAMAIS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sijamais.app.widgets
        PRODUCT_NAME: SijamaisWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  Sijamais:
    build:
      targets:
        Sijamais: all
    run:
      config: Debug
      # Achats simulés dans Xcode (simulateur ou iPhone branché), sans compte Apple Developer.
      storeKitConfiguration: Sijamais/Premium.storekit
    test:
      config: Debug
      targets:
        - package: SijamaisKit/SijamaisCoreTests
