# Description du projet Xcode, lue par XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Régénérer le projet après un ajout de fichier : xcodegen generate (dans le dossier app).
name: Sijamais
options:
  bundleIdPrefix: fr.sijamais
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SijamaisKit:
    path: SijamaisKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sijamais:
    type: application
    platform: iOS
    sources:
      - path: Sijamais
    dependencies:
      - package: SijamaisKit
        product: SijamaisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sijamais.app
        PRODUCT_NAME: Sijamais
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SIJAMAIS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Sijamais:
    build:
      targets:
        Sijamais: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SijamaisKit/SijamaisCoreTests
